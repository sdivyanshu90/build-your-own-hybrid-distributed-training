name: Multi-GPU (NCCL)

# GitHub's hosted runners have no GPUs, so this workflow is manual and requires
# a self-hosted runner labelled `gpu` with at least two visible CUDA devices.
#
# To run the same suite locally, without any CI:
#
#   pytest -q -m "cuda"        # tests needing one GPU
#   pytest -q -m "multigpu"    # tests needing two or more
#   torchrun --standalone --nproc-per-node=2 examples/train_fsdp.py
#   python scripts/benchmark.py --world-size 2 --backend nccl
#
# Tests marked `cuda` / `multigpu` skip themselves cleanly on a machine without
# the hardware, naming the device count they found, so running the whole suite
# on a CPU-only box is always safe.
on:
  workflow_dispatch:
    inputs:
      gpus:
        description: "Number of GPUs to use"
        required: false
        default: "2"

env:
  OMP_NUM_THREADS: "1"

jobs:
  nccl-tests:
    name: NCCL tests on ${{ github.event.inputs.gpus }} GPU(s)
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4

      - name: Report hardware
        run: |
          nvidia-smi
          python -c "import torch; print('torch', torch.__version__); \
                     print('devices', torch.cuda.device_count()); \
                     print('nccl', torch.distributed.is_nccl_available())"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: CUDA-marked tests
        run: pytest -q -m "cuda" --timeout=900

      - name: Multi-GPU NCCL tests
        run: pytest -q -m "multigpu" --timeout=900

      - name: Full suite on GPU hardware
        # With GPUs present, `backend: auto` selects NCCL, so the ordinary
        # suite exercises the NCCL path as well as Gloo.
        run: pytest -q --timeout=900

      - name: Examples under NCCL
        run: |
          N="${{ github.event.inputs.gpus }}"
          torchrun --standalone --nproc-per-node="$N" examples/train_ddp.py --steps 8
          torchrun --standalone --nproc-per-node="$N" examples/train_fsdp.py --steps 8
          torchrun --standalone --nproc-per-node="$N" examples/train_hybrid.py \
            --config configs/fsdp_4gpu.yaml --steps 8

      - name: Benchmark on GPU
        run: |
          python scripts/benchmark.py --world-size "${{ github.event.inputs.gpus }}" \
            --backend nccl --hidden-size 1024 --num-layers 8 --json
